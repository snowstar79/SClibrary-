name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild clean archive \
            -project OldPlayer.xcodeproj \
            -scheme OldPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OldPlayer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/OldPlayer.xcarchive/Products/Applications/OldPlayer.app build/Payload/
          cd build && zip -r OldPlayer.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OldPlayer-IPA
          path: build/OldPlayer.ipa
